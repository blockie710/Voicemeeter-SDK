name: Example Workflow With Secrets

on:
  workflow_dispatch:  # Manual trigger
  release:
    types: [created]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Run tests
        run: npm test
      
      # Example of using NPM_TOKEN secret
      - name: Publish to NPM
        if: github.event_name == 'release'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      # Example of using GITHUB_TOKEN
      - name: Upload artifacts to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./dist/voicemeeter-sdk.zip
          asset_name: voicemeeter-sdk.zip
          asset_content_type: application/zip
          
      # Example of using NUGET_API_KEY
      - name: Setup .NET
        if: github.event_name == 'release'
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'
          
      - name: Package NuGet
        if: github.event_name == 'release'
        run: dotnet pack -c Release -o ./nupkgs
        
      - name: Publish NuGet Package
        if: github.event_name == 'release'
        run: dotnet nuget push ./nupkgs/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
      
      # Example of using signing secrets
      - name: Sign Release
        if: github.event_name == 'release'
        run: |
          echo "${{ secrets.SIGNING_KEY }}" > signing-key.pem
          chmod 600 signing-key.pem
          # Example command - replace with actual signing command
          # sign-binary --cert signing-key.pem --password "${{ secrets.SIGNING_CERT_PASSWORD }}" --file ./dist/voicemeeter-sdk.zip
          rm signing-key.pem
```
